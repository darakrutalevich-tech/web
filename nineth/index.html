<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Асинхронные операции в JavaScript</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
            background: #f5f5f5;
            color: #333;
        }

        h1 {
            color: #2c3e50;
            text-align: center;
            margin-bottom: 30px;
        }

        .section {
            background: white;
            padding: 20px;
            margin-bottom: 20px;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
        }

        .section h2 {
            color: #3498db;
            margin-top: 0;
            padding-bottom: 10px;
            border-bottom: 1px solid #eee;
        }

        .task-item {
            padding: 8px 0;
            border-bottom: 1px dotted #eee;
        }

        .task-item:last-child {
            border-bottom: none;
        }

        .post-item {
            padding: 10px;
            margin-bottom: 8px;
            background: #f9f9f9;
            border-left: 3px solid #3498db;
            border-radius: 4px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
        }

        th {
            background: #ecf0f1;
            padding: 10px;
            text-align: left;
            border-bottom: 2px solid #bdc3c7;
        }

        td {
            padding: 10px;
            border-bottom: 1px solid #eee;
        }

        tr:hover {
            background: #f8f9fa;
        }

        .currency-code {
            font-weight: bold;
            color: #2c3e50;
        }

        .btn {
            background: #3498db;
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 4px;
            cursor: pointer;
            margin-top: 10px;
        }

        .btn:hover {
            background: #2980b9;
        }

        .loading {
            color: #7f8c8d;
            font-style: italic;
        }

        .success {
            color: #27ae60;
        }

        .error {
            color: #e74c3c;
            background: #ffeaea;
            padding: 10px;
            border-radius: 4px;
            margin-top: 10px;
        }
    </style>
</head>

<body>
    <h1>Асинхронные операции в JavaScript</h1>

    <div class="section">
        <h2>Выполнение задач</h2>
        <div id="tasksOutput">
            <div class="loading" id="tasksLoading">Выполнение задач...</div>
            <div id="tasksList"></div>
        </div>
    </div>

    <div class="section">
        <h2>Загрузка постов</h2>
        <div id="postsOutput">
            <div class="loading" id="postsLoading">Загрузка постов...</div>
            <div id="postsList"></div>
            <button class="btn" onclick="loadPosts()">Обновить</button>
        </div>
    </div>

    <div class="section">
        <h2>Курсы валют</h2>
        <div id="ratesOutput">
            <div class="loading" id="ratesLoading">Загрузка курсов...</div>
            <div id="ratesTable"></div>
            <button class="btn" onclick="loadExchangeRates()">Обновить</button>
        </div>
    </div>

    <script>
        const tasksList = document.getElementById('tasksList');
        const tasksLoading = document.getElementById('tasksLoading');
        const postsList = document.getElementById('postsList');
        const postsLoading = document.getElementById('postsLoading');
        const ratesTable = document.getElementById('ratesTable');
        const ratesLoading = document.getElementById('ratesLoading');

        async function runTask(taskName, delay) {
            return new Promise((resolve) => {
                setTimeout(() => {
                    resolve(`${taskName} выполнена`);
                }, delay);
            });
        }

        async function runAllTasks() {
            const tasks = [
                { name: "Задача 1", time: 1000 },
                { name: "Задача 2", time: 800 },
                { name: "Задача 3", time: 600 }
            ];

            for (let task of tasks) {
                const taskDiv = document.createElement('div');
                taskDiv.className = 'task-item';
                taskDiv.textContent = `Выполняется: ${task.name}...`;
                tasksList.appendChild(taskDiv);

                const result = await runTask(task.name, task.time);

                taskDiv.textContent = `✓ ${result}`;
                taskDiv.className = 'task-item success';
            }

            tasksLoading.style.display = 'none';

            const doneDiv = document.createElement('div');
            doneDiv.className = 'task-item success';
            doneDiv.textContent = 'Все задачи завершены!';
            tasksList.appendChild(doneDiv);
        }

        async function loadPosts() {
            postsLoading.style.display = 'block';
            postsList.innerHTML = '';

            try {
                const response = await fetch('https://jsonplaceholder.typicode.com/posts?_limit=5');
                const posts = await response.json();

                posts.forEach(post => {
                    const postDiv = document.createElement('div');
                    postDiv.className = 'post-item';
                    postDiv.textContent = post.title;
                    postsList.appendChild(postDiv);
                    console.log(post.title);
                });

                postsLoading.style.display = 'none';
            } catch (err) {
                postsLoading.style.display = 'none';
                postsList.innerHTML = `<div class="error">Ошибка: ${err.message}</div>`;
            }
        }

        async function loadExchangeRates() {
            ratesLoading.style.display = 'block';
            ratesTable.innerHTML = '';

            try {
                const response = await fetch('https://api.nbrb.by/exrates/rates?periodicity=0');
                const rates = await response.json();

                let tableHTML = `
                    <table>
                        <tr>
                            <th>Код</th>
                            <th>Единиц</th>
                            <th>Курс</th>
                        </tr>
                `;

                rates.forEach(rate => {
                    tableHTML += `
                        <tr>
                            <td><span class="currency-code">${rate.Cur_Abbreviation}</span></td>
                            <td>${rate.Cur_Scale}</td>
                            <td>${rate.Cur_OfficialRate}</td>
                        </tr>
                    `;
                });

                tableHTML += '</table>';
                ratesTable.innerHTML = tableHTML;
                ratesLoading.style.display = 'none';
            } catch (err) {
                ratesLoading.style.display = 'none';
                ratesTable.innerHTML = `<div class="error">Ошибка: ${err.message}</div>`;
            }
        }

        document.addEventListener('DOMContentLoaded', () => {
            runAllTasks();
            loadPosts();
            loadExchangeRates();
        });
    </script>
</body>

</html>
